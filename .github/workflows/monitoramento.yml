name: Monitoramento de concursos ES

# Valida os dados, regenera o README e prepara o resumo de e-mail.
#
# SEGURANCA: nenhuma credencial neste arquivo. As credenciais de SMTP vem de
# GitHub Secrets e sao injetadas apenas no passo de envio. O token do GitHub
# usado para commitar e o GITHUB_TOKEN efemero da propria execucao.

on:
  schedule:
    # Todos os dias as 08:00 no horario de Brasilia (UTC-3, sem horario de verao).
    # O agendamento do GitHub Actions usa UTC: 11:00 UTC = 08:00 em Brasilia.
    # Execucoes agendadas podem sair alguns minutos depois do horario em picos de
    # fila do GitHub; o horario nao e garantido ao minuto.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      forcar_email:
        description: "Regerar o resumo ignorando o estado de envios anterior"
        type: boolean
        default: false
      forcar_relatorio:
        description: "Regerar os relatorios mesmo que o arquivo do periodo ja exista"
        type: boolean
        default: false
      gerar_semanal:
        description: "Gerar tambem o relatorio da ultima semana fechada"
        type: boolean
        default: false
      gerar_mensal:
        description: "Gerar tambem o relatorio do ultimo mes fechado"
        type: boolean
        default: false
  pull_request:
    paths:
      - "dados/**"
      - "ferramentas/**"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "dados/**"
      - "ferramentas/**"

permissions:
  contents: read

# Sobre 'runs-on: ubuntu-latest': o GitHub avisa que o label migra de versao de
# tempo em tempo. A escolha e deliberada — aqui so rodam Python da biblioteca
# padrao, git e gh, sem dependencia de versao do sistema. Fixar uma imagem
# (ubuntu-24.04) trocaria um risco pequeno de mudanca por um risco pior: quando o
# GitHub retira a imagem fixada, a execucao agendada quebra de vez, e ninguem esta
# olhando para um cron diario.
jobs:
  # Porta de entrada para PR e push: aqui a validacao PRECISA reprovar dados
  # incoerentes. Na execucao agendada esse papel fica com o passo de revalidacao
  # dentro de 'atualizar', que roda depois do encerramento automatico de prazos.
  validar:
    name: Validar dados
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validar registros
        run: python3 ferramentas/validar.py

      - name: Conferir se o README esta sincronizado com os dados
        run: python3 ferramentas/gerar_readme.py --check

  atualizar:
    name: Atualizar README e preparar e-mail
    # Só escreve no repositorio em execucao agendada ou manual, nunca em PR.
    #
    # Sem 'needs: validar' de proposito. Um prazo de inscricao que vence deixa o
    # registro momentaneamente incoerente (status 'inscricoes_abertas' com prazo
    # passado), e o validador reprova — corretamente. Se este job dependesse dele,
    # o primeiro prazo vencido travaria README, relatorios e e-mail justamente no
    # dia em que ha novidade. A ordem aqui resolve isso: encerra os vencidos,
    # atualiza tudo e SO ENTAO revalida, antes de commitar.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      tem_novidade: ${{ steps.email.outputs.tem_novidade }}
      arquivo_email: ${{ steps.email.outputs.arquivo }}
      novos_achados: ${{ steps.coleta.outputs.novos }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Primeiro passo de dados: abre as inscricoes que comecaram e encerra as que
      # venceram. Sao transicoes mecanicas, baseadas nas datas que ja estavam no
      # registro — nenhuma fonte e consultada aqui, e a trilha em
      # historico_status diz isso explicitamente.
      - name: Atualizar status conforme os prazos
        id: prazos
        run: |
          python3 ferramentas/atualizar_prazos.py \
            --saida-github "$GITHUB_OUTPUT"

      # Coleta antes de gerar o README, para que as descobertas do dia entrem
      # na secao "Detectado automaticamente". Uma fonte fora do ar nao derruba
      # o passo: coletar.py registra o erro e segue com as demais.
      - name: Coletar fontes automaticas
        id: coleta
        run: |
          python3 ferramentas/coletar.py \
            --saida-github "$GITHUB_OUTPUT" \
            --relatorio-md "$RUNNER_TEMP/novos-achados.md"

      - name: Regenerar tabelas do README
        run: python3 ferramentas/gerar_readme.py

      # Diario todos os dias; semanal na segunda-feira (fecha a semana anterior);
      # mensal no dia 1 (fecha o mes anterior). Um relatorio escrito a mao nao e
      # sobrescrito: gerar_relatorio.py so reescreve o que ele mesmo gerou.
      - name: Gerar relatorios
        env:
          FORCAR: ${{ inputs.forcar_relatorio && '--forcar' || '' }}
        run: |
          set -euo pipefail
          dia_da_semana=$(date -u +%u)   # 1 = segunda
          dia_do_mes=$(date -u +%d)

          python3 ferramentas/gerar_relatorio.py --tipo diario $FORCAR

          if [ "$dia_da_semana" = "1" ] || [ "${{ inputs.gerar_semanal }}" = "true" ]; then
            python3 ferramentas/gerar_relatorio.py --tipo semanal $FORCAR
          fi

          if [ "$dia_do_mes" = "01" ] || [ "${{ inputs.gerar_mensal }}" = "true" ]; then
            python3 ferramentas/gerar_relatorio.py --tipo mensal $FORCAR
          fi

      - name: Preparar resumo de e-mail
        id: email
        run: |
          set +e
          if [ "${{ inputs.forcar_email }}" = "true" ]; then
            python3 ferramentas/gerar_email.py --forcar
          else
            python3 ferramentas/gerar_email.py
          fi
          codigo=$?
          set -e
          # 0 = ha novidade a enviar; 2 = nada mudou; qualquer outro = erro real.
          if [ "$codigo" = "0" ]; then
            echo "tem_novidade=true" >> "$GITHUB_OUTPUT"
            echo "arquivo=email/$(date -u +%Y-%m-%d)-resumo.md" >> "$GITHUB_OUTPUT"
          elif [ "$codigo" = "2" ]; then
            echo "tem_novidade=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::gerar_email.py falhou com codigo $codigo"
            exit "$codigo"
          fi

      - name: Revalidar depois das alteracoes
        run: python3 ferramentas/validar.py

      - name: Commitar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Estaciona PRIMEIRO e só depois verifica se há algo a commitar. O
          # inverso (git diff --quiet antes do add) ignora arquivos novos ainda
          # nao rastreados, como email/<data>-resumo.md e relatorios/diarios/*.
          git add -A README.md email/ relatorios/ dados/ historico/ descobertas/
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao a commitar."
            exit 0
          fi
          git commit -m "update: atualiza resumo de concursos do ES ($(date -u +%Y-%m-%d))"
          # Corrida com outro push no main: rebaseia e tenta de novo.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Push concluido na tentativa $tentativa."
              exit 0
            fi
            echo "Push falhou; sincronizando com origin/main e tentando novamente."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::nao foi possivel enviar o commit para o main"
          exit 1

      # Notificacao sem intervencao: quando a coleta acha algo que nao esta em
      # dados/, abre uma issue com a lista. Roda depois do commit para que os
      # links do relatorio ja existam no repositorio.
      - name: Abrir issue com os achados novos
        if: steps.coleta.outputs.novos != '0' && steps.coleta.outputs.novos != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORPO: ${{ runner.temp }}/novos-achados.md
        run: |
          # Garante o label antes de usa-lo. Se ja existe, a API responde 422 e
          # o '|| true' mantem o passo seguindo.
          gh api "repos/${GITHUB_REPOSITORY}/labels" \
            -f name="coleta-automatica" \
            -f color="1d76db" \
            -f description="Achados da coleta automatica pendentes de conferencia" \
            >/dev/null 2>&1 || true

          titulo="Coleta automatica: ${{ steps.coleta.outputs.novos }} nova(s) oportunidade(s) do ES — $(date -u +%Y-%m-%d)"
          if url=$(gh api "repos/${GITHUB_REPOSITORY}/issues" \
                     -f title="$titulo" \
                     -F body=@"$CORPO" \
                     -f "labels[]=coleta-automatica" \
                     --jq '.html_url'); then
            echo "Issue aberta: $url"
            echo "### Achados novos: [$titulo]($url)" >> "$GITHUB_STEP_SUMMARY"
          else
            # A atualizacao de dados ja foi commitada com sucesso; nao faz
            # sentido reprovar a execucao por causa da notificacao.
            echo "::warning::nao foi possivel abrir a issue (issues desabilitadas ou sem permissao). Os achados estao em descobertas/descobertas.json"
          fi

  enviar_email:
    name: Enviar resumo por e-mail
    needs: atualizar
    if: needs.atualizar.outputs.tem_novidade == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # As credenciais vem exclusivamente de GitHub Secrets. Configure em
      # Settings > Secrets and variables > Actions > New repository secret:
      #   SMTP_SERVIDOR        obrigatorio  ex.: smtp.gmail.com
      #   SMTP_USUARIO         obrigatorio  usuario de autenticacao no SMTP
      #   SMTP_SENHA           obrigatorio  senha de aplicativo / token SMTP
      #   EMAIL_DESTINATARIO   obrigatorio  quem recebe (varios, separados por virgula)
      #   SMTP_PORTA           opcional     587 (STARTTLS, padrao) ou 465 (SSL)
      #   EMAIL_REMETENTE      opcional     padrao: o proprio SMTP_USUARIO
      #
      # O destinatario vai em SECRET, e nao em variable, de proposito: este
      # repositorio e publico e os logs de execucao tambem sao. Valor de secret
      # aparece mascarado no log; valor de variable aparece em texto puro.
      #
      # O passo e ignorado sem erro se os secrets nao estiverem configurados,
      # para que o repositorio funcione sem e-mail.
      - name: Verificar configuracao de SMTP
        id: check
        env:
          SMTP_SERVIDOR: ${{ secrets.SMTP_SERVIDOR }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: |
          faltando=""
          for nome in SMTP_SERVIDOR SMTP_USUARIO SMTP_SENHA EMAIL_DESTINATARIO; do
            # Checa se a variavel esta vazia sem ecoar o conteudo dela.
            if [ -z "$(printenv "$nome")" ]; then
              faltando="$faltando $nome"
            fi
          done
          if [ -n "$faltando" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E-mail nao enviado: secrets ausentes ->$faltando. O resumo foi gerado em email/ e versionado no repositorio."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar
        if: steps.check.outputs.configurado == 'true'
        env:
          SMTP_SERVIDOR: ${{ secrets.SMTP_SERVIDOR }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          ARQUIVO_RESUMO: ${{ needs.atualizar.outputs.arquivo_email }}
        run: python3 ferramentas/enviar_email.py
